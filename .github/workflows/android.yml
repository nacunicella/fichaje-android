name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la clave de firma
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/fichaje-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/fichaje-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk fichaje.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fichaje-apk
          path: fichaje.apk

      # Cada versión de main queda publicada; la app la detecta y ofrece actualizar.
      # Link fijo a la última: https://github.com/nacunicella/fichaje-android/releases/latest/download/fichaje.apk
      - name: Publicar versión
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Fichaje 0.1.${{ github.run_number }}
          files: fichaje.apk
          make_latest: true
